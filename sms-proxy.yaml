apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-proxy
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sms-proxy
  template:
    metadata:
      labels:
        app: sms-proxy
    spec:
      containers:
      - name: sms-proxy
        image: sms-proxy:1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 10020
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: sms-proxy
  namespace: keycloak
spec:
  selector:
    app: sms-proxy
  ports:
  - port: 10020
    targetPort: 10020
